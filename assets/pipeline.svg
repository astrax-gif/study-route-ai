<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-label="Pipeline: PDFs to LLM extraction to review to Python scheduler to daily plan and audio coach" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 8 8; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      .node { animation: pop 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.4s; } .n5 { animation-delay: 3.2s; }
      @keyframes pop { 0%,60%,100% { transform: scale(1); } 10% { transform: scale(1.07); } }
    </style>
  </defs>

  <!-- connectors -->
  <g stroke="url(#g)" stroke-width="3" fill="none" class="flow">
    <path d="M150 100 H190"/><path d="M330 100 H370"/><path d="M510 100 H550"/><path d="M690 100 H730"/>
  </g>

  <!-- nodes -->
  <g class="t" text-anchor="middle">
    <g class="node">
      <rect x="20" y="60" width="130" height="80" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <text x="85" y="95" font-size="22" fill="#fff">&#128196;</text>
      <text x="85" y="122" font-size="14" fill="#c7d2fe" font-weight="600">Syllabus PDFs</text>
    </g>
    <g class="node n2">
      <rect x="190" y="60" width="140" height="80" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="260" y="95" font-size="22" fill="#fff">&#129504;</text>
      <text x="260" y="122" font-size="14" fill="#c7d2fe" font-weight="600">LLM extracts JSON</text>
    </g>
    <g class="node n3">
      <rect x="370" y="60" width="140" height="80" rx="14" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
      <text x="440" y="95" font-size="22" fill="#fff">&#9999;&#65039;</text>
      <text x="440" y="122" font-size="14" fill="#c7d2fe" font-weight="600">Student reviews</text>
    </g>
    <g class="node n4">
      <rect x="550" y="60" width="140" height="80" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
      <text x="620" y="95" font-size="22" fill="#fff">&#128013;</text>
      <text x="620" y="122" font-size="14" fill="#a5f3fc" font-weight="600">Python scheduler</text>
    </g>
    <g class="node n5">
      <rect x="730" y="60" width="150" height="80" rx="14" fill="#083344" stroke="#67e8f9" stroke-width="2"/>
      <text x="805" y="95" font-size="22" fill="#fff">&#127911;</text>
      <text x="805" y="122" font-size="14" fill="#a5f3fc" font-weight="600">Daily plan + coach</text>
    </g>
  </g>

  <text class="t" x="260" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">reads documents</text>
  <text class="t" x="620" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">deterministic, no LLM</text>
  <text class="t" x="805" y="175" text-anchor="middle" font-size="12" fill="#94a3b8">text or audio</text>
</svg>

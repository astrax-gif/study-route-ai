<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="Study Route AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: center bottom; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
      .orb { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .line { opacity: 0; animation: cycle 12s infinite; }
      .l1 { animation-delay: 0s; } .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
      @keyframes cycle { 0% {opacity:0; transform: translateY(8px);} 6% {opacity:1; transform: translateY(0);} 30% {opacity:1;} 36% {opacity:0;} 100% {opacity:0;} }
      .title { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: 0.92; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- floating orbs -->
  <circle class="orb" cx="90" cy="60" r="34" fill="#818cf8" opacity="0.18"/>
  <circle class="orb" cx="800" cy="200" r="46" fill="#22d3ee" opacity="0.15" style="animation-delay:-2s"/>
  <circle class="orb" cx="700" cy="50" r="18" fill="#c4b5fd" opacity="0.25" style="animation-delay:-4s"/>

  <!-- title -->
  <text class="t title" x="450" y="110" text-anchor="middle" font-size="58" font-weight="800" fill="url(#title)">Study Route AI</text>

  <!-- cycling taglines -->
  <g class="t" font-size="22" fill="#e0e7ff" text-anchor="middle">
    <text class="line l1" x="450" y="156">Syllabi in. A daily plan out.</text>
    <text class="line l2" x="450" y="156">The AI reads. The code plans. No hallucinated deadlines.</text>
    <text class="line l3" x="450" y="156">Listen to today's brief. Get quizzed. Stay on track.</text>
  </g>

  <!-- audio waveform -->
  <g fill="#67e8f9">
    <rect class="bar" x="345" y="190" width="8" height="40" rx="4" style="animation-delay:0s"/>
    <rect class="bar" x="365" y="190" width="8" height="40" rx="4" style="animation-delay:.15s"/>
    <rect class="bar" x="385" y="190" width="8" height="40" rx="4" style="animation-delay:.3s"/>
    <rect class="bar" x="405" y="190" width="8" height="40" rx="4" style="animation-delay:.45s"/>
    <rect class="bar" x="425" y="190" width="8" height="40" rx="4" style="animation-delay:.6s"/>
    <rect class="bar" x="445" y="190" width="8" height="40" rx="4" style="animation-delay:.75s"/>
    <rect class="bar" x="465" y="190" width="8" height="40" rx="4" style="animation-delay:.6s"/>
    <rect class="bar" x="485" y="190" width="8" height="40" rx="4" style="animation-delay:.45s"/>
    <rect class="bar" x="505" y="190" width="8" height="40" rx="4" style="animation-delay:.3s"/>
    <rect class="bar" x="525" y="190" width="8" height="40" rx="4" style="animation-delay:.15s"/>
    <rect class="bar" x="545" y="190" width="8" height="40" rx="4" style="animation-delay:0s"/>
  </g>
</svg>
